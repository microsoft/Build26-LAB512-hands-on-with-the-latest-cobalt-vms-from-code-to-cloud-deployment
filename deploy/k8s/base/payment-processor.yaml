apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-processor
  labels:
    app.kubernetes.io/name: payment-processor
    app.kubernetes.io/part-of: eshop
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: payment-processor
      app.kubernetes.io/part-of: eshop
  template:
    metadata:
      labels:
        app.kubernetes.io/name: payment-processor
        app.kubernetes.io/part-of: eshop
    spec:
      initContainers:
        - name: wait-for-rabbitmq
          image: eshop/busybox:1.37
          command: ['sh', '-c', 'until nc -z rabbitmq 5672; do sleep 2; done']
      containers:
        - name: payment-processor
          image: eshop/payment-processor:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: ASPNETCORE_FORWARDEDHEADERS_ENABLED
              value: "true"
            - name: ASPNETCORE_HTTP_PORTS
              value: "8080"
            - name: ConnectionStrings__eventbus
              value: amqp://guest:guest@rabbitmq:5672
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: payment-processor
  labels:
    app.kubernetes.io/name: payment-processor
    app.kubernetes.io/part-of: eshop
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: payment-processor
    app.kubernetes.io/part-of: eshop
  ports:
    - name: http
      port: 80
      targetPort: 8080
