apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../../base
  # Webapp: split identity URLs — internal for backchannel, external for browser
  # Identity API: register webapp's browser-facing URL as valid redirect
patches:
- patch: |-
    - op: replace
      path: /spec/template/spec/containers/0/imagePullPolicy
      value: Always
  target:
    kind: Deployment
    labelSelector: app.kubernetes.io/part-of=eshop
- patch: |-
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: placeholder
    spec:
      template:
        spec:
          imagePullSecrets:
          - name: acr-pull-secret
  target:
    kind: Deployment
    labelSelector: app.kubernetes.io/part-of=eshop
- patch: |-
    - op: replace
      path: /spec/type
      value: LoadBalancer
    - op: replace
      path: /spec/ports/0/port
      value: 80
    - op: add
      path: /metadata/annotations
      value:
        service.beta.kubernetes.io/azure-dns-label-name: LAB512_DNS_LABEL
  target:
    kind: Service
    name: webapp
- patch: |-
    - op: replace
      path: /spec/type
      value: LoadBalancer
    - op: replace
      path: /spec/ports/0/port
      value: 80
    - op: add
      path: /metadata/annotations
      value:
        service.beta.kubernetes.io/azure-dns-label-name: LAB512_DNS_LABEL-identity
  target:
    kind: Service
    name: identity-api
- patch: |-
    - op: replace
      path: /spec/type
      value: LoadBalancer
    - op: replace
      path: /spec/ports/0/port
      value: 5200
  target:
    kind: Service
    name: inference
- patch: |-
    - op: add
      path: /spec/template/spec/containers/0/env/-
      value:
        name: INFERENCE_INTRA_OP_THREADS
        value: "8"
    - op: replace
      path: /spec/template/spec/containers/0/resources/limits/cpu
      value: "7"
  target:
    kind: Deployment
    name: inference
- patch: |-
    - op: test
      path: /spec/template/spec/containers/0/env/12/name
      value: IdentityUrl
    - op: replace
      path: /spec/template/spec/containers/0/env/12/value
      value: http://identity-api
    - op: test
      path: /spec/template/spec/containers/0/env/13/name
      value: CallBackUrl
    - op: replace
      path: /spec/template/spec/containers/0/env/13/value
      value: http://LAB512_DNS_LABEL.westus3.cloudapp.azure.com
    - op: add
      path: /spec/template/spec/containers/0/env/-
      value:
        name: IdentityUrlExternal
        value: http://LAB512_DNS_LABEL-identity.westus3.cloudapp.azure.com
  target:
    kind: Deployment
    name: webapp
- patch: |-
    - op: test
      path: /spec/template/spec/containers/0/env/7/name
      value: WebAppClient
    - op: replace
      path: /spec/template/spec/containers/0/env/7/value
      value: http://LAB512_DNS_LABEL.westus3.cloudapp.azure.com
  target:
    kind: Deployment
    name: identity-api
